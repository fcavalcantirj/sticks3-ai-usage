<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Usage</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #33415e;
      --text: #e2e8f0; --muted: #94a3b8;
      --ok: #3b82f6; --warn: #f59e0b; --crit: #ef4444; --off: #6b7280;
      --plan-blue: #3b82f6; --credit-green: #22c55e; --free-grey: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; min-height: 100vh;
    }
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
    .msg-error {
      display: none; background: rgba(239,68,68,0.1); border: 1px solid var(--crit);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: var(--crit);
    }
    .token-row { display: none; gap: 8px; margin-bottom: 12px; }
    .token-row input {
      flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 13px;
    }
    .token-row button { background: var(--ok); color: var(--bg); border: none; }

    /* --- Header: pills + interval + refresh (always visible) --- */
    .header-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 12px; flex: 1; min-width: 0; }
    .pill {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 18px; min-width: 140px; text-align: center;
    }
    .pill .num { font-size: 22px; font-weight: 700; color: var(--text); }
    .pill .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 2px; }
    .pill .est { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .pill .ratio { font-size: 11px; font-weight: 600; margin-top: 2px; }
    .pill .ratio.warn { color: var(--warn); }
    .pill .ratio.ok { color: var(--ok); }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .interval-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
    #interval-select {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 4px 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    #interval-select:disabled { opacity: 0.5; cursor: default; }
    button {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: var(--border); }
    button:active { opacity: 0.8; }
    .refreshing { opacity: 0.6; pointer-events: none; }

    /* --- Tab strip --- */
    .tab-strip {
      display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .tab-strip button {
      background: transparent; border: none; border-bottom: 3px solid transparent;
      padding: 8px 16px; border-radius: 0; font-size: 13px; font-weight: 600;
      color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .tab-strip button[aria-selected="true"] {
      border-color: var(--ok); color: var(--ok);
    }
    .tab-strip button:hover { background: rgba(255,255,255,0.03); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .tab-panel-scroll { max-height: calc(100vh - 200px); overflow-y: auto; }

    /* --- Quota cards --- */
    .cards { display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .card.stale { opacity: 0.7; }
    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .card-title { font-size: 15px; font-weight: 600; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .badge-plan { background: #33415e; color: var(--muted); }
    .badge-status { border-radius: 4px; }
    .badge-stale { background: rgba(100,116,140,0.15); color: var(--muted); }
    .badge-auth  { background: rgba(245,158,11,0.15);  color: var(--warn); }
    .badge-error { background: rgba(239,68,68,0.15);   color: var(--crit); }
    .badge-off   { background: rgba(100,116,140,0.15); color: var(--muted); }
    .row { margin-bottom: 10px; }
    .row:last-child { margin-bottom: 0; }
    .row-inner { display: flex; align-items: center; gap: 10px; }
    .row.stale .bar-fill { opacity: 0.5; }
    .label { min-width: 110px; font-size: 13px; color: var(--text); }
    .bar-wrap { flex: 1; }
    .bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; }
    .usage { min-width: 90px; font-size: 12px; color: var(--muted); text-align: right; }
    .reset { min-width: 150px; font-size: 12px; color: var(--muted); text-align: right; }
    .quota-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 960px) { .quota-grid { grid-template-columns: 1fr 1fr; } }

    /* --- Activity heatmaps --- */
    .heatmap-container { margin-bottom: 12px; }
    .heatmap-scale {
      display: flex; align-items: center; gap: 4px; margin-top: 4px;
      font-size: 10px; color: var(--muted);
    }
    .heatmap-scale .swatch {
      width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0;
    }
    .heatmap { display: grid; grid-template-columns: repeat(52, 1fr); gap: 2px; }
    .heat-cell {
      width: 10px; height: 10px; border-radius: 2px;
      background: #1e293b; border: 0.5px solid #0f172a;
    }
    .heat-cell:hover { border-color: var(--muted); }
    .heat-label { font-size: 10px; color: var(--muted); }
    /* Raised empty-cell colour — was #0f172a (same as body bg), now a visible grid. */
    .heat-0 { background: #1e293b; }
    .heat-1 { background: #2a3a5e; }
    .heat-2 { background: #33415e; }
    .heat-3 { background: #3b82f6; }
    .heat-4 { background: #2563eb; }
    .heat-today { border: 1.5px solid var(--text); }

    /* --- Models table --- */
    .table-scroll { max-height: calc(100vh - 200px); overflow-y: auto; }
    table.models { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.models th { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    table.models td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
    table.models .model-name { font-family: monospace; font-size: 12px; }

    /* --- Attention list --- */
    .attention-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .attention-item:last-child { border-bottom: none; }
    .chip { padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .chip-critical { background: rgba(239,68,68,0.15); color: var(--crit); }
    .chip-watch { background: rgba(245,158,11,0.15); color: var(--warn); }
    .chip-stale { background: rgba(100,116,140,0.15); color: var(--muted); }
    .device-accent { background: rgba(59,130,246,0.04); border-radius: 6px; margin: 4px 0 8px 0; }

    /* --- Footer --- */
    .footer-bar { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
    .footer-bar .info { font-size: 12px; color: var(--muted); }

    /* --- Settings page --- */
    .provider-grid { display: flex; flex-direction: column; gap: 12px; }
    .provider-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
    }
    .provider-card-header {
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      user-select: text;
    }
    .provider-card-header:hover { background: rgba(255,255,255,0.03); }
    .provider-card-header .provider-label {
      flex: 1; padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 13px;
    }
    .key-state {
      font-size: 12px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 120px;
    }
    .card-chevron {
      font-size: 11px; color: var(--muted);
      transition: transform 0.2s; margin-left: 4px;
    }
    .provider-card.expanded .card-chevron { transform: rotate(90deg); }
    .provider-card-body { display: none; }
    .provider-card.expanded .provider-card-body { display: block; }
    .toggle-label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text); cursor: pointer; user-select: none;
    }
    .toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--off); border-radius: 11px;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      position: absolute; content: ""; height: 16px; width: 16px;
      left: 3px; bottom: 3px; border-radius: 50%;
      background: var(--bg); transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--ok); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }
    .key-state-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .key-state { font-size: 12px; color: var(--muted); }
    .key-state .env-name { color: var(--text); }
    .key-state-set { color: var(--ok); }
    .btn-small {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 4px 10px; border-radius: 6px;
      font-size: 12px; cursor: pointer; flex-shrink: 0;
    }
    .btn-small:hover { background: var(--border); }
    .plan-block { margin-top: 10px; }
    .plan-row {
      display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .plan-row:last-child { margin-bottom: 0; }
    .plan-input {
      flex: 1; padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 12px;
    }
    .plan-row .plan-label { flex: 0 0 70px; font-size: 11px; color: var(--muted); }
    .field-error {
      background: rgba(239,68,68,0.1); border: 1px solid var(--crit);
      border-radius: 6px; padding: 6px 10px; margin-bottom: 8px;
      font-size: 12px; color: var(--crit);
    }
    .saved-ok { color: var(--ok); font-size: 12px; }
    .saved-err { color: var(--crit); font-size: 12px; }
    .settings-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .settings-card .card-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .settings-card .card-title { font-size: 15px; font-weight: 600; }
    .settings-card .row { margin-bottom: 10px; }
    .settings-card .row:last-child { margin-bottom: 0; }
    .settings-card .row-inner { display: flex; align-items: center; gap: 10px; }
    .settings-card label {
      font-size: 12px; color: var(--muted); min-width: 140px;
    }
    .settings-card select,
    .settings-card input[type="number"] {
      padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 13px;
    }
    .settings-card select { width: 160px; }
    .settings-card input[type="number"] { width: 120px; }
    #pair-code-field {
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 14px;
      width: 210px; text-transform: uppercase; letter-spacing: 3px;
    }
    #pair-code-field:disabled { opacity: 0.5; }
    #pair-status { display: block; }
    #pair-devices { display: block; font-size: 11px; }
    #wifi-card input[type="text"],
    #wifi-card input[type="password"] {
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 13px; width: 200px;
    }
    #wifi-card input:disabled { opacity: 0.5; }
    #wifi-card .toggle-label { min-width: 0; font-size: 12px; color: var(--muted); }
    #wifi-current, #wifi-status, #wifi-notice { display: block; }
    #wifi-notice { font-size: 11px; line-height: 1.5; }

    /* --- Mobile --- */
    @media (max-width: 959px) {
      .pills { flex-direction: column; align-items: stretch; }
      .header-bar { flex-direction: column; align-items: stretch; }
      .quota-grid { grid-template-columns: 1fr; }
      .heatmap { grid-template-columns: repeat(52, 1fr); }
      table.models, table.models thead, table.models tbody, table.models tr, table.models td, table.models th { display: block; width: 100%; }
      table.models tr { border-bottom: 1px solid var(--border); }
      table.models td { display: inline-block; min-width: 45%; }
      .heat-month-label { display: none; }
    }
  </style>
</head>
<body>
  <div class="page-title">AI Usage</div>
  <div id="auth-error" class="msg-error"></div>
  <div id="token-input" class="token-row">
    <input type="password" id="token-field" placeholder="Enter device token" autocomplete="off">
    <button id="token-save">Save</button>
  </div>

  <!-- Header: stat pills + interval + refresh (always visible) -->
  <div class="header-bar">
    <div id="stat-pills" class="pills">
      <div class="pill"><div class="num" id="pill-today-tok">—</div><div class="lbl">Tokens today</div></div>
      <div class="pill"><div class="num" id="pill-month-tok">—</div><div class="lbl">Tokens this month</div></div>
      <div class="pill"><div class="num" id="pill-today-cost">$—</div><div class="lbl">Cost today</div><div class="est">est.</div></div>
      <div class="pill"><div class="num" id="pill-month-cost">$—</div><div class="lbl">Cost this month</div><div class="est">est.</div><div class="ratio" id="pill-month-ratio"></div></div>
    </div>
    <div class="header-actions">
      <span class="interval-label">Refresh every</span>
      <select id="interval-select" aria-label="Refresh interval">
        <option value="300">5 min</option>
        <option value="600">10 min</option>
        <option value="900" selected>15 min</option>
        <option value="1800">30 min</option>
        <option value="3600">60 min</option>
      </select>
      <button id="refresh-btn">Refresh now</button>
    </div>
  </div>

  <!-- Tab strip -->
  <div class="tab-strip" role="tablist">
    <button id="tab-quota-tab" role="tab" aria-controls="tab-quota" aria-selected="true">Quota</button>
    <button id="tab-activity-tab" role="tab" aria-controls="tab-activity" aria-selected="false">Activity</button>
    <button id="tab-models-tab" role="tab" aria-controls="tab-models" aria-selected="false">Models</button>
    <button id="tab-attention-tab" role="tab" aria-controls="tab-attention" aria-selected="false">Needs attention</button>
    <button id="tab-settings-tab" role="tab" aria-controls="tab-settings" aria-selected="false">Settings</button>
  </div>

  <!-- Quota tab: provider cards -->
  <div id="tab-quota" class="tab-panel active">
    <div id="cards" class="quota-grid cards"></div>
  </div>

  <!-- Activity tab: heatmaps -->
  <div id="tab-activity" class="tab-panel">
    <div id="activity" class="cards">
      <div id="heatmap-claude_code" class="card" style="display:none;"></div>
      <div id="heatmap-codex" class="card" style="display:none;"></div>
    </div>
  </div>

  <!-- Models tab: table (scrolls inside its own pane) -->
  <div id="tab-models" class="tab-panel">
    <div class="table-scroll">
      <table id="models-table" class="models">
        <thead><tr><th>Model</th><th>Tokens today</th><th>Tokens month</th><th>Est. cost month</th><th>Requests</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Attention tab: attention list -->
  <div id="tab-attention" class="tab-panel">
    <div id="attention" class="cards"></div>
  </div>

  <!-- Settings tab: editable config backed by /v1/config -->
  <div id="tab-settings" class="tab-panel">
    <div id="settings-form" style="display:none;">
      <div class="settings-card">
        <div class="card-header"><span class="card-title">Alerts</span></div>
        <div class="row">
          <label for="setting-openrouter-low">OpenRouter low balance (USD)</label>
          <input type="number" id="setting-openrouter-low" min="0" step="0.01">
        </div>
        <div class="row">
          <label for="setting-quota-warn">Quota warn at</label>
          <input type="number" id="setting-quota-warn" min="50" max="100">
          <span style="color:var(--muted);font-size:11px;">%</span>
        </div>
      </div>
      <div class="settings-card">
        <div class="card-header"><span class="card-title">Providers</span></div>
        <div id="provider-list" class="provider-grid"></div>
      </div>
      <div class="field-error" id="settings-error" style="display:none;"></div>
      <div class="row">
        <button id="save-config-btn">Save settings</button>
        <span id="settings-status" class="info" style="margin-left:10px;"></span>
      </div>

      <!-- Pair a device (task 78). The device token is ISSUED here instead of
           being compiled into the firmware. The 6-character code appears on the
           DEVICE SCREEN and nowhere else: this page never receives it, which is
           what makes typing it proof that you are holding the device. -->
      <div class="settings-card" id="pair-card">
        <div class="card-header"><span class="card-title">Pair a device</span></div>
        <div class="row">
          <span id="pair-status" class="info">Checking&hellip;</span>
        </div>
        <div class="row row-inner">
          <button id="pair-open-btn">Open pairing window</button>
          <input type="text" id="pair-code-field" maxlength="8" autocomplete="off"
                 spellcheck="false" placeholder="Code on the device" disabled>
          <button id="pair-confirm-btn" disabled>Confirm code</button>
        </div>
        <div class="row">
          <span id="pair-devices" class="info"></span>
        </div>
      </div>

      <!-- Device Wi-Fi (task 79). The everyday case: move an already-reachable
           device to a different network. The captive portal on the device
           bootstraps one that has never joined anything; this maintains one
           that has.

           THE PASSWORD FIELD IS ALWAYS BLANK ON LOAD, AND THAT IS CORRECT. The
           password is write-only through this page: it is sent once with
           PUT /v1/netcfg and never read back, exactly like a provider key.
           GET /v1/netcfg reports only whether one is set and WHERE the value
           lives (the key_state / key_source convention). -->
      <div class="settings-card" id="wifi-card">
        <div class="card-header"><span class="card-title">Device Wi-Fi</span></div>
        <div class="row">
          <span id="wifi-current" class="info">Checking&hellip;</span>
        </div>
        <div class="row row-inner">
          <input type="text" id="wifi-ssid-field" maxlength="32" autocomplete="off"
                 spellcheck="false" placeholder="Network name (SSID)">
          <input type="password" id="wifi-pass-field" maxlength="64"
                 autocomplete="new-password" placeholder="Password">
          <label class="toggle-label" for="wifi-open-check">
            <input type="checkbox" id="wifi-open-check"> open network
          </label>
        </div>
        <div class="row row-inner">
          <button id="wifi-apply-btn">Send to device</button>
          <button id="wifi-cancel-btn" class="btn-small" style="display:none;">Cancel pending change</button>
          <span id="wifi-status" class="info"></span>
        </div>
        <div class="row">
          <span id="wifi-notice" class="info"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <span id="footer-text" class="info">Data as of — · checked — · rev — · seq —</span>
  </div>

<script>
/*
 * AI Usage dashboard — vanilla JS, no build step, one file.
 *
 * Protocol: poll /v1/usage every N s (from /v1/config interval) with
 * If-None-Match; poll /v1/stats on its own interval with ETag. On 304 update
 * the "checked" time from /healthz; on 200 re-render only the changed sections.
 * Reset texts tick every 30 s.
 *
 * Token is read from ?token= (→ localStorage usaged_token), sent as
 * X-Device-Token on every /v1/* call; 401 surfaces an inline token input.
 *
 * First-paint fix (ORDER #48 latent bug): the stats etag is NEVER sent on the
 * first load — a stale etag from a previous session would make the server
 * return 304 with no body, and the page would stay at placeholder zeros forever.
 */

// ---- Pure helpers ----

function tierColor(tier) {
  var m = { ok: "#3b82f6", warn: "#f59e0b", crit: "#ef4444", off: "#6b7280" };
  return m[tier] || "#6b7280";
}

function planLabel(plan) {
  if (plan === "max_20x") return "Max (20x)";
  if (plan === "plus")    return "Plus";
  return plan || "";
}

function statusBadge(status, msg) {
  if (status === "ok") return "";
  if (status === "off") return badge("off", "no key");
  if (status === "stale") return badge("stale", "stale \u00b7 " + msg);
  if (status === "auth")  return badge("auth",  msg);
  if (status === "error") return badge("error", msg);
  return "";
}

function badge(cls, text) {
  return '<span class="badge badge-status badge-' + cls + '">' + esc(text) + '</span>';
}

function fmtTime(unixSec) {
  if (!unixSec) return "\u2014";
  var d = new Date(unixSec * 1000);
  return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function resetText(resetAt, fallbackTxt) {
  if (!resetAt) return fallbackTxt || "";
  var now = Math.floor(Date.now() / 1000);
  var diff = resetAt - now;
  if (diff <= 0) return fallbackTxt || "";
  if (diff > 86400) {
    var d = new Date(resetAt * 1000);
    return "Resets " + d.toLocaleDateString(undefined, { weekday: "short" }) +
           " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }
  var h = Math.floor(diff / 3600);
  var m = Math.floor((diff % 3600) / 60);
  return "Resets in " + h + "h " + m + "m";
}

function pctText(pct, txt) {
  return pct != null ? (pct + "% used") : (txt || "");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { "&": "&#38;", "<": "&#60;", ">": "&#62;", '"': "&#34;", "'": "&#39;" }[c];
  });
}

function fmtTokens(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}

function fmtCost(n) {
  return "$" + n.toFixed(2);
}

// ---- Token handling ----

function getToken() {
  return localStorage.getItem("usaged_token") || "";
}

function authHeaders() {
  var h = {};
  var t = getToken();
  if (t) h["X-Device-Token"] = t;
  return h;
}

function stripTokenFromUrl() {
  var params = new URLSearchParams(window.location.search);
  var t = params.get("token");
  if (t) {
    localStorage.setItem("usaged_token", t);
    params.delete("token");
    var u = window.location.pathname + (params.toString() ? "?" + params.toString() : "");
    window.history.replaceState({}, "", u);
  }
}

// ---- State ----

var lastRev = null;       // full ETag header value, e.g. '"abcd1234"'
var lastProviderJson = {}; // id \u2192 JSON string of last-rendered provider
var lastStatsJson = null;   // JSON string of last-rendered stats report
var statsRendered = false; // true after the first successful stats paint
var currentInterval = 300; // seconds, from /v1/config
var cfg_listen_cache = "";   // listen address from last GET /v1/config
var cfg_tz_cache = "";       // tz from last GET /v1/config
var currentDeviceState = null;  // from GET /v1/device (no ETag, polled separately)
var currentSnap = null;         // latest /v1/usage snapshot (for attention re-render)

// ---- Fetch ----

function loadUsage() {
  var headers = authHeaders();
  if (lastRev) headers["If-None-Match"] = lastRev;
  return fetch("/v1/usage", { headers: headers }).then(function(resp) {
    if (resp.status === 401) { showTokenInput(); return null; }
    if (resp.status === 304)  { loadHealthz(); return null; }
    return resp.json();
  });
}

// loadDevice fetches the StickS3 device state from GET /v1/device — a dedicated
// endpoint with NO ETag, polled on its own timer (ORDER #66 task 67). Device
// state changes every second (seconds_since) and must never live inside the
// ETag-cached /v1/usage payload, which is only present on 200 responses.
function loadDevice() {
  var headers = authHeaders();
  return fetch("/v1/device", { headers: headers }).then(function(resp) {
    if (resp.status === 401) { showTokenInput(); return null; }
    if (!resp.ok) return null;
    return resp.json();
  });
}

function loadStats() {
  var headers = authHeaders();
  // First-paint fix (ORDER #48 latent bug): never send If-None-Match on the
  // first load — a stale etag from a previous session would yield a 304 with
  // no body, leaving the page at placeholder zeros forever.
  if (statsRendered) {
    var prevEtag = localStorage.getItem("stats_etag");
    if (prevEtag) headers["If-None-Match"] = prevEtag;
  }
  return fetch("/v1/stats", { headers: headers }).then(function(resp) {
    if (resp.status === 401) { showTokenInput(); return null; }
    if (resp.status === 304)  { return null; }
    var etag = resp.headers.get("ETag");
    if (etag) localStorage.setItem("stats_etag", etag);
    return resp.json();
  });
}

function loadConfig() {
  var headers = authHeaders();
  return fetch("/v1/config", { headers: headers }).then(function(resp) {
    if (resp.status === 401) { showTokenInput(); return null; }
    if (!resp.ok) return null;
    return resp.json();
  }).then(function(cfg) {
    if (cfg && cfg.interval_sec) {
      currentInterval = cfg.interval_sec;
      var sel = document.getElementById("interval-select");
      if (sel) {
        for (var i = 0; i < sel.options.length; i++) {
          if (Number(sel.options[i].value) === cfg.interval_sec) {
            sel.selectedIndex = i; break;
          }
        }
      }
    }
    if (cfg) {
      cfg_listen_cache = cfg.listen || "";
      cfg_tz_cache = cfg.tz || "";
    }
    return cfg;
  });
}

function loadHealthz() {
  fetch("/healthz", { headers: authHeaders() })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(h) { if (h) updateFooterChecked(h); });
}

// ---- Settings rendering ----

function renderSettings(cfg) {
  var form = document.getElementById("settings-form");
  if (!form) return;
  form.style.display = "block";

  // The interval select lives in the header (single control — ORDER #65 task 68).
  // Keep the header select in sync with the persisted value.
  var intervalVal = cfg.interval_sec || 900;
  var headerSel = document.getElementById("interval-select");
  if (headerSel) {
    for (var j = 0; j < headerSel.options.length; j++) {
      if (Number(headerSel.options[j].value) === intervalVal) {
        headerSel.selectedIndex = j; break;
      }
    }
  }

  // Populate alerts.
  if (cfg.alerts) {
    if (cfg.alerts.openrouter_low_usd != null) {
      document.getElementById("setting-openrouter-low").value = cfg.alerts.openrouter_low_usd;
    }
    if (cfg.alerts.quota_warn_pct != null) {
      document.getElementById("setting-quota-warn").value = cfg.alerts.quota_warn_pct;
    }
  }

  // Render provider cards.
  var list = document.getElementById("provider-list");
  list.innerHTML = "";
  var errEl = document.getElementById("settings-error");
  errEl.style.display = "none";
  errEl.textContent = "";

  if (!cfg.providers || cfg.providers.length === 0) {
    list.innerHTML = '<div class="key-state" style="color:var(--muted);">No providers configured</div>';
    return;
  }

  cfg.providers.forEach(function(p) {
    list.appendChild(createProviderCard(p));
  });
}

function createProviderCard(p) {
  var card = document.createElement("div");
  card.className = "provider-card";
  card.setAttribute("data-pid", p.id);

  // Header — always visible, acts as the collapse toggle.
  var header = document.createElement("div");
  header.className = "provider-card-header";

  // Enabled toggle
  var toggleWrap = document.createElement("label");
  toggleWrap.className = "toggle-label";
  toggleWrap.innerHTML =
    '<span class="toggle"><input type="checkbox" data-field="enabled" ' +
    (p.enabled ? "checked" : "") + '><span class="toggle-slider"></span></span>' +
    '<span style="font-size:12px;">Enabled</span>';
  // Header click toggles the card (not the checkbox).
  toggleWrap.onclick = function(e) { e.stopPropagation(); };
  header.appendChild(toggleWrap);

  // Label input
  var labelInput = document.createElement("input");
  labelInput.type = "text";
  labelInput.className = "provider-label";
  labelInput.setAttribute("data-field", "label");
  labelInput.value = p.label || p.id;
  header.appendChild(labelInput);

  // Key state summary (uses key_source for the real source label, ORDER #66 task 67c)
  var keySummary = document.createElement("span");
  keySummary.className = "key-state";
  keySummary.innerHTML = keyStateLabel(p);
  header.appendChild(keySummary);

  // Collapse chevron
  var chevron = document.createElement("span");
  chevron.className = "card-chevron";
  chevron.textContent = "\u25b6";  // ▶
  header.appendChild(chevron);

  header.onclick = function() { toggleProviderCard(card); };
  card.appendChild(header);

  // Collapsible body — starts hidden (ORDER #66 task 67b: no page scroll).
  var body = document.createElement("div");
  body.className = "provider-card-body";

  // Key state row with Set/Remove buttons (only for providers with key_env)
  var keyEnv = p.key_env || "";
  if (p.key_state === "set" || keyEnv) {
    var keyRow = document.createElement("div");
    keyRow.className = "key-state-row";

    if (keyEnv) {
      var setBtn = document.createElement("button");
      setBtn.className = "btn-small";
      setBtn.textContent = "Set key";
      setBtn.setAttribute("data-pid", p.id);
      setBtn.setAttribute("data-action", "set-key");
      setBtn.onclick = function(e) { e.stopPropagation(); setKeyPrompt(p.id); };
      keyRow.appendChild(setBtn);

      var rmBtn = document.createElement("button");
      rmBtn.className = "btn-small";
      rmBtn.textContent = "Remove key";
      rmBtn.setAttribute("data-action", "remove-key");
      rmBtn.onclick = function(e) { e.stopPropagation(); removeKey(p.id); };
      keyRow.appendChild(rmBtn);
    }
    body.appendChild(keyRow);
  }

  // Probe toggle: gated on provider capability (can_probe), not parse-time flag.
  if (p.can_probe) {
    var probeRow = document.createElement("div");
    probeRow.className = "key-state-row";
    var probeLabel = document.createElement("label");
    probeLabel.className = "toggle-label";
    probeLabel.innerHTML =
      '<span class="toggle"><input type="checkbox" data-field="probe" ' +
      (p.probe ? "checked" : "") + '><span class="toggle-slider"></span></span>' +
      '<span style="font-size:12px;">Groq probe</span>';
    probeLabel.onclick = function(e) { e.stopPropagation(); };
    probeRow.appendChild(probeLabel);
    body.appendChild(probeRow);
  }

  // Plan block for claude/codex
  if (p.plan) {
    var planBlock = document.createElement("div");
    planBlock.className = "plan-block";

    var planTitle = document.createElement("div");
    planTitle.className = "card-title";
    planTitle.textContent = "Subscription plan";
    planTitle.style.fontSize = "12px";
    planTitle.style.marginBottom = "8px";
    planBlock.appendChild(planTitle);

    planBlock.appendChild(makePlanRow("cost", "Cost", "number", p.plan.cost || "", "60px"));
    planBlock.appendChild(makePlanRow("currency", "Currency", "text", p.plan.currency || "USD", "70px"));
    planBlock.appendChild(makePlanRow("label", "Label", "text", p.plan.label || "", "80px"));
    planBlock.appendChild(makePlanRow("cost_usd", "USD equiv", "number", p.plan.cost_usd || "", "90px"));

    body.appendChild(planBlock);
  }

  card.appendChild(body);
  return card;
}

// keyStateLabel renders the key state using the REAL source (ORDER #66 task 67c).
// env-var providers show "via env VAR", OAuth providers show their actual
// credential location (Claude Code keyring, ~/.codex/auth.json), and only
// usaged's own Keychain entry says "in Keychain".
function keyStateLabel(p) {
  var ks = p.key_state || "not_set";
  var src = p.key_source || "none";
  var keyEnv = p.key_env || "";

  if (ks === "set") {
    if (src && src.indexOf("env:") === 0) {
      return '<span class="key-state-set">Key set</span> via env <span class="env-name">' + esc(src.substring(4)) + '</span>';
    }
    if (src === "claude-code") {
      return '<span class="key-state-set">Key set</span> via Claude Code';
    }
    if (src === "codex") {
      return '<span class="key-state-set">Key set</span> via ~/.codex/auth.json';
    }
    if (src === "keychain") {
      return '<span class="key-state-set">Key set</span> in Keychain';
    }
    // Fallback for any other "set" source
    return '<span class="key-state-set">Key set</span>';
  }

  // key_state === "not_set"
  if (keyEnv) {
    return 'Key in env <span class="env-name">' + esc(keyEnv) + '</span> (not set)';
  }
  if (src === "claude-code" || src === "codex") {
    return '<span style="color:var(--warn);">No key set</span>';
  }
  return '<span style="color:var(--warn);">No key set</span>';
}

// toggleProviderCard expands/collapses a provider card body. Only one card
// is open at a time (ORDER #66 task 67b).
function toggleProviderCard(card) {
  var isOpen = card.classList.contains("expanded");
  // Close all cards.
  var cards = document.querySelectorAll(".provider-card");
  cards.forEach(function(c) { c.classList.remove("expanded"); });
  if (!isOpen) {
    card.classList.add("expanded");
  }
}

function makePlanRow(field, labelText, type, val, labelW) {
  var row = document.createElement("div");
  row.className = "plan-row";
  var lbl = document.createElement("span");
  lbl.className = "plan-label";
  lbl.textContent = labelText;
  lbl.style.minWidth = labelW;
  var inp = document.createElement("input");
  inp.className = "plan-input";
  inp.type = type;
  inp.setAttribute("data-field", "plan." + field);
  inp.value = val;
  if (type === "number") {
    inp.setAttribute("step", "0.01");
    inp.setAttribute("min", "0");
  } else {
    inp.setAttribute("minlength", "3");
  }
  row.appendChild(lbl);
  row.appendChild(inp);
  return row;
}

function saveSettings() {
  var errEl = document.getElementById("settings-error");
  errEl.style.display = "none";
  errEl.textContent = "";

  var interval = parseInt(document.getElementById("interval-select").value, 10);
  if (isNaN(interval) || interval < 300) {
    showSettingsStatus("Interval must be at least 5 min (300 s)", false);
    return;
  }

  var alerts = {
    openrouter_low_usd: parseFloat(document.getElementById("setting-openrouter-low").value) || 0,
    quota_warn_pct: parseInt(document.getElementById("setting-quota-warn").value, 10) || 95
  };

  // Gather provider data from each card.
  var providers = [];
  var cards = document.querySelectorAll("#provider-list .provider-card");
  cards.forEach(function(card) {
    var pid = card.getAttribute("data-pid");
    var enabled = card.querySelector('input[data-field="enabled"]').checked;
    var label = card.querySelector('input[data-field="label"]').value.trim();

    var providerObj = { id: pid, enabled: enabled, label: label };

    // Probe (if present)
    var probeCb = card.querySelector('input[data-field="probe"]');
    if (probeCb) {
      providerObj.probe = probeCb.checked;
    }

    // Plan (if present)
    var costInp = card.querySelector('input[data-field="plan.cost"]');
    if (costInp) {
      providerObj.plan = {
        cost: parseFloat(costInp.value) || 0,
        currency: card.querySelector('input[data-field="plan.currency"]').value.trim(),
        label: card.querySelector('input[data-field="plan.label"]').value.trim(),
        cost_usd: parseFloat(card.querySelector('input[data-field="plan.cost_usd"]').value) || 0
      };
    }

    providers.push(providerObj);
  });

  // Inline validation: name the bad field.
  var badField = null;
  if (isNaN(interval)) badField = "interval_sec";
  providers.forEach(function(p) {
    if (!p.label) badField = badField || "providers." + p.id + ".label";
    if (p.plan) {
      if (p.plan.cost < 0) badField = "providers." + p.id + ".plan.cost";
      if (p.plan.cost_usd !== 0 && p.plan.cost_usd < 0) badField = "providers." + p.id + ".plan.cost_usd";
    }
  });

  if (badField) {
    errEl.textContent = "Invalid field: " + badField;
    errEl.style.display = "block";
    return;
  }

  var payload = JSON.stringify({
    interval_sec: interval,
    listen: cfg_listen_cache,
    tz: cfg_tz_cache,
    alerts: alerts,
    providers: providers
  });
  var headers = authHeaders();
  headers["Content-Type"] = "application/json";

  var btn = document.getElementById("save-config-btn");
  btn.disabled = true;
  btn.textContent = "Saving…";

  fetch("/v1/config", { method: "PUT", headers: headers, body: payload })
    .then(function(r) {
      if (r.status === 401) { showTokenInput(); return; }
      if (!r.ok) {
        return r.json().then(function(e) {
          showSettingsStatus("Save failed: " + (e.error || r.statusText), false);
        }).catch(function() {
          showSettingsStatus("Save failed: " + r.statusText, false);
        });
      }
      showSettingsStatus("Saved", true);
      // Sync the header interval select.
      var sel = document.getElementById("interval-select");
      if (sel) {
        for (var i = 0; i < sel.options.length; i++) {
          if (Number(sel.options[i].value) === interval) {
            sel.selectedIndex = i; break;
          }
        }
      }
    })
    .catch(function(err) {
      showSettingsStatus("Save failed: " + err.message, false);
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = "Save settings";
    });
}

function showSettingsStatus(msg, ok) {
  var el = document.getElementById("settings-status");
  el.textContent = msg;
  el.style.color = ok ? "var(--ok)" : "var(--crit)";
}

function loadSettings() {
  fetch("/v1/config", { headers: authHeaders() })
    .then(function(r) { if (r.status === 401) { showTokenInput(); return null; } return r.ok ? r.json() : null; })
    .then(function(cfg) { if (cfg) renderSettings(cfg); });
  refreshPairStatus();
  loadWifi();
}

// ---- Key management ----

function setKeyPrompt(pid) {
  var val = prompt("Enter the API key for " + pid + ". It is stored in the macOS Keychain and never written to the config file.");
  if (!val || !val.trim()) return;
  var headers = authHeaders();
  headers["Content-Type"] = "application/json";
  fetch("/v1/keys", {
    method: "POST",
    headers: headers,
    body: JSON.stringify({ id: pid, value: val })
  }).then(function(r) {
    if (r.status === 401) { showTokenInput(); return; }
    if (!r.ok) { r.text().then(function(t) { alert("Failed: " + t); }); return; }
    alert("Key stored in Keychain for " + pid);
    loadSettings();
  });
}

function removeKey(pid) {
  if (!confirm("Remove the Keychain key for " + pid + "?")) return;
    var headers = authHeaders();
    headers["Content-Type"] = "application/json";
    fetch("/v1/keys?id=" + encodeURIComponent(pid), {
    method: "DELETE",
    headers: headers
  }).then(function(r) {
    if (r.status === 401) { showTokenInput(); return; }
    if (!r.ok) { r.text().then(function(t) { alert("Failed: " + t); }); return; }
    alert("Key removed for " + pid);
    loadSettings();
  });
}

// ---- Device pairing (task 78) ----
//
// A publishable firmware binary carries no credentials, so the device is GIVEN
// its token: open a short-lived window here, the device shows a 6-character
// code on its own screen, type that code, and the agent hands the device a
// token of its own.
//
// This page never sees the code and never sees the token. GET /v1/pair reports
// the state of the window only — the code lives on the device screen (that is
// what makes typing it proof of physical possession) and the token goes
// straight to the device.

var pairTimer = 0;
var pairPrevState = "";   // so the "paired" moment can be reported once

function openPairWindow() {
  var headers = authHeaders();
  headers["Content-Type"] = "application/json";
  fetch("/v1/pair/open", { method: "POST", headers: headers, body: "{}" })
    .then(function(r) { if (r.status === 401) { showTokenInput(); return null; } return r.json(); })
    .then(function(js) {
      if (!js) return;
      renderPairStatus(js);
      startPairPolling();
    });
}

function confirmPairCode() {
  var field = document.getElementById("pair-code-field");
  var code = (field.value || "").trim();
  if (!code) return;
  var headers = authHeaders();
  headers["Content-Type"] = "application/json";
  fetch("/v1/pair/confirm", { method: "POST", headers: headers, body: JSON.stringify({ code: code }) })
    .then(function(r) { if (r.status === 401) { showTokenInput(); return null; } return r.json(); })
    .then(function(js) {
      if (!js) return;
      if (js.ok) {
        field.value = "";
        setPairMessage("Code accepted. Waiting for the device to collect its token\u2026", true);
      } else {
        setPairMessage(js.error || "That code was not accepted.", false);
      }
      startPairPolling();
    });
}

function refreshPairStatus() {
  fetch("/v1/pair", { headers: authHeaders() })
    .then(function(r) { if (r.status === 401) { showTokenInput(); return null; } return r.ok ? r.json() : null; })
    .then(function(js) { if (js) renderPairStatus(js); });
}

function renderPairStatus(js) {
  var field = document.getElementById("pair-code-field");
  var confirmBtn = document.getElementById("pair-confirm-btn");
  var openBtn = document.getElementById("pair-open-btn");
  var waiting = js.state === "claimed";
  var wasDisabled = field.disabled;
  var msg;

  if (js.state === "idle" && pairPrevState === "approved") {
    // The window closes the instant the device collects its token, so this is
    // the only moment the page can report success.
    msg = "Paired. The device has a token of its own and will start fetching.";
  } else if (js.state === "open") {
    msg = "Window open, " + fmtCountdown(js.expires_in_sec) +
          " left. Power on the device and wait for its code to appear.";
  } else if (js.state === "claimed") {
    msg = "A device at " + ((js.device && js.device.peer) || "the LAN") + " is showing a " +
          (js.code_len || 6) + "-character code. Type it here \u2014 " +
          fmtCountdown(js.expires_in_sec) + " left.";
  } else if (js.state === "approved") {
    msg = "Code accepted. Waiting for the device to collect its token\u2026";
  } else {
    msg = "No pairing window is open. Open one, then power on the device \u2014 " +
          "the window closes after " + fmtCountdown(js.window_ttl_sec || 180) + ".";
  }
  setPairMessage(msg, true);

  field.disabled = !waiting;
  confirmBtn.disabled = !waiting;
  openBtn.textContent = js.state === "idle" ? "Open pairing window" : "Restart pairing window";
  // Focus only on the transition into "type the code now", never on every
  // poll — otherwise the cursor is yanked back every two seconds.
  if (waiting && wasDisabled) field.focus();

  renderPairDevices(js.devices);
  pairPrevState = js.state;
  if (js.state === "idle") stopPairPolling();
}

function renderPairDevices(devices) {
  var el = document.getElementById("pair-devices");
  if (!devices || !devices.length) {
    el.textContent = "No device has been paired yet.";
    return;
  }
  var parts = devices.map(function(d) {
    return esc(d.name ? d.name + " (" + d.id + ")" : d.id) + " \u00b7 paired " + fmtTime(d.issued_at);
  });
  el.innerHTML = "Paired: " + parts.join(" \u00b7 ");
}

function setPairMessage(msg, ok) {
  var el = document.getElementById("pair-status");
  el.textContent = msg;
  el.style.color = ok ? "var(--muted)" : "var(--crit)";
}

function fmtCountdown(sec) {
  sec = Math.max(0, parseInt(sec || 0, 10));
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}

// The window is short-lived, so poll while one is in flight and stop as soon
// as it closes — no timer runs when there is nothing to watch.
function startPairPolling() {
  stopPairPolling();
  pairTimer = setInterval(refreshPairStatus, 2000);
}

function stopPairPolling() {
  if (pairTimer) { clearInterval(pairTimer); pairTimer = 0; }
}

// ---- Device Wi-Fi (task 79) ----
//
// The everyday case: move an already-reachable device to a different network.
// The captive portal on the device bootstraps one that has never joined
// anything; this page maintains one that has.
//
// THE PASSWORD IS WRITE-ONLY THROUGH THIS PAGE. It goes out once with
// PUT /v1/netcfg and is never read back — GET /v1/netcfg reports only whether
// one is set and WHERE the value lives, so the field is blank on every load by
// design. Nothing here ever renders a credential it received from the agent.
//
// The change lands on the device's NEXT check-in, not instantly, and the
// wording for that (and for the recovery path) comes from the server: a curl of
// the endpoint gets the same answer this page shows.

var wifiTimer = 0;

// loadWifi refreshes the card. msg, when given, replaces the status line after
// the render — that is how a one-off note from a DELETE survives the reload.
function loadWifi(msg) {
  fetch("/v1/netcfg", { headers: authHeaders() })
    .then(function(r) { if (r.status === 401) { showTokenInput(); return null; } return r.ok ? r.json() : null; })
    .then(function(js) {
      if (!js) return;
      renderWifi(js);
      if (msg) setWifiStatus(msg, false);
    });
}

function renderWifi(js) {
  document.getElementById("wifi-current").innerHTML = wifiCurrentHtml(js);
  document.getElementById("wifi-notice").textContent =
    (js.notice || "") + " " + (js.recovery || "");

  var pending = js.pending;
  document.getElementById("wifi-cancel-btn").style.display = pending ? "inline-block" : "none";

  if (pending) {
    var head = pending.delivered > 0
      ? "The device has collected this change and is joining "
      : "Waiting for the device to pick this up: ";
    setWifiStatus(head + pending.ssid + " \u2014 expires in " +
                  fmtExpiry(pending.expires_in_sec) + ".", true);
    startWifiPolling();
  } else {
    setWifiStatus(wifiOutcomeText(js.last), wifiOutcomeOk(js.last));
    stopWifiPolling();
  }
}

// wifiCurrentHtml names the network the DEVICE says it is on — the agent only
// ever sees an IP, so this is the device's own report, not an observation.
function wifiCurrentHtml(js) {
  var d = js.device;
  var where;
  if (d && d.ssid) {
    where = "Device is on <span class=\"env-name\">" + esc(d.ssid) + "</span>";
    if (d.state && d.state !== "connected") where += " (" + esc(d.state) + ")";
    where += " \u00b7 reported " + (d.seconds_since || 0) + "s ago";
  } else if (d) {
    where = "The device checked in but did not name its network";
  } else {
    where = "No device has reported its network yet";
  }
  return where + " \u00b7 " + wifiPasswordLabel(js);
}

// wifiPasswordLabel follows the key_state / key_source convention the provider
// cards use: whether a password is set, and WHERE the value actually lives.
// It never implies this page holds one.
function wifiPasswordLabel(js) {
  var st = js.password_state || "not_set";
  var src = js.password_source || "none";
  if (src === "pending-change") {
    return st === "set"
      ? "<span class=\"key-state-set\">Password set</span> in the pending change \u2014 held in memory here until the device collects it"
      : "Open network staged \u2014 no password";
  }
  if (src === "device") {
    return st === "set"
      ? "<span class=\"key-state-set\">Password set</span> on the device (NVS) \u2014 never sent to this page"
      : "Open network \u2014 no password";
  }
  return "Password unknown until the device reports in";
}

// wifiOutcomeText explains what became of the last change. A change that
// simply vanished from the page would read as a broken feature, and the
// failure cases are the ones a user most needs spelled out.
function wifiOutcomeText(last) {
  if (!last) return "No change pending.";
  var s = last.state;
  var net = last.ssid || "that network";
  if (s === "applied")    return "Applied \u2014 the device joined " + net + ".";
  if (s === "failed")     return "The device could not join " + net + " and fell back" +
                                 (last.error ? " (" + last.error + ")" : "") +
                                 ". Check the device screen if it did not come back.";
  if (s === "stalled")    return "The device collected the change for " + net +
                                 " but never confirmed it, so nothing further was sent. Check the device screen.";
  if (s === "expired")    return "The change for " + net + " expired before the device collected it.";
  if (s === "cancelled")  return "The change for " + net + " was cancelled.";
  if (s === "superseded") return "The change for " + net + " was replaced by a newer one.";
  return "No change pending.";
}

// fmtExpiry is coarse on purpose. The change TTL is two hours, and the mm:ss
// countdown the pairing window uses would render that as "119:59".
function fmtExpiry(sec) {
  sec = Math.max(0, parseInt(sec || 0, 10));
  if (sec >= 3600) {
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return m ? h + "h " + m + "m" : h + "h";
  }
  if (sec >= 60) return Math.floor(sec / 60) + " min";
  return sec + "s";
}

function wifiOutcomeOk(last) {
  return !last || (last.state !== "failed" && last.state !== "stalled");
}

function sendWifi() {
  var ssidEl = document.getElementById("wifi-ssid-field");
  var passEl = document.getElementById("wifi-pass-field");
  var openEl = document.getElementById("wifi-open-check");
  var ssid = (ssidEl.value || "").trim();
  if (!ssid) { setWifiStatus("Enter the network name.", false); return; }

  // The agent validates (GOLDEN_RULES #3) — this only avoids a pointless round
  // trip on an obviously empty form.
  var payload = { ssid: ssid, open: openEl.checked };
  if (!openEl.checked) payload.password = passEl.value;

  var headers = authHeaders();
  headers["Content-Type"] = "application/json";
  var btn = document.getElementById("wifi-apply-btn");
  btn.disabled = true;
  fetch("/v1/netcfg", { method: "PUT", headers: headers, body: JSON.stringify(payload) })
    .then(function(r) { if (r.status === 401) { showTokenInput(); return null; } return r.json(); })
    .then(function(js) {
      if (!js) return;
      if (!js.ok) { setWifiStatus(js.error || "The change was refused.", false); return; }
      // The credential does not stay in the DOM once it has been sent.
      passEl.value = "";
      loadWifi();
    })
    .catch(function(err) { setWifiStatus("Send failed: " + err.message, false); })
    .finally(function() { btn.disabled = false; });
}

function cancelWifi() {
  fetch("/v1/netcfg", { method: "DELETE", headers: authHeaders() })
    .then(function(r) { if (r.status === 401) { showTokenInput(); return null; } return r.json(); })
    .then(function(js) {
      if (!js) return;
      if (!js.ok) { setWifiStatus(js.error || "Nothing to cancel.", false); return; }
      // js.note appears when the device already had it: cancelling cannot
      // recall a change the device is acting on right now.
      loadWifi(js.note || "");
    });
}

function setWifiStatus(msg, ok) {
  var el = document.getElementById("wifi-status");
  el.textContent = msg;
  el.style.color = ok ? "var(--muted)" : "var(--crit)";
}

// Poll only while a change is in flight, so no timer runs with nothing to watch.
function startWifiPolling() {
  if (wifiTimer) return;
  wifiTimer = setInterval(function() { loadWifi(); }, 5000);
}

function stopWifiPolling() {
  if (wifiTimer) { clearInterval(wifiTimer); wifiTimer = 0; }
}

// ---- Tab handling ----

function setupTabs() {
  var tabs = document.querySelectorAll(".tab-strip button[role=\"tab\"]");
  tabs.forEach(function(btn) {
    btn.addEventListener("click", function() {
      var target = btn.getAttribute("aria-controls");
      showTab(target);
    });
  });
  // Restore saved tab or default to quota.
  var saved = localStorage.getItem("usaged_tab");
  if (saved && document.getElementById(saved)) {
    showTab(saved);
  } else {
    showTab("tab-quota");
  }
}

function showTab(panelId) {
  var panels = document.querySelectorAll(".tab-panel");
  panels.forEach(function(p) {
    p.classList.remove("active");
    p.style.display = "none";
  });
  var tabs = document.querySelectorAll(".tab-strip button[role=\"tab\"]");
  tabs.forEach(function(b) {
    b.setAttribute("aria-selected", "false");
  });
  var panel = document.getElementById(panelId);
  if (panel) {
    panel.classList.add("active");
    panel.style.display = "block";
  }
  var btn = document.querySelector(".tab-strip button[aria-controls=\"" + panelId + "\"]");
  if (btn) btn.setAttribute("aria-selected", "true");
  localStorage.setItem("usaged_tab", panelId);
  // Lazy-load settings when the tab is first opened.
  if (panelId === "tab-settings") {
    loadSettings();
  }
}

// ---- Rendering ----

function renderSnapshot(snap) {
  var container = document.getElementById("cards");
  snap.providers.forEach(function(p) {
    var jsonStr = JSON.stringify(p);
    var cardEl = document.getElementById("card-" + p.id);
    if (lastProviderJson[p.id] !== jsonStr) {
      if (cardEl) {
        cardEl.className = "card" + (p.status === "stale" ? " stale" : "");
        cardEl.innerHTML = cardInner(p);
      } else {
        container.insertAdjacentHTML("beforeend", cardElHtml(p));
      }
    }
    lastProviderJson[p.id] = jsonStr;
  });
  // Remove cards for providers no longer present.
  for (var id in lastProviderJson) {
    if (!snap.providers.some(function(p) { return p.id === id; })) {
      var old = document.getElementById("card-" + id);
      if (old) old.remove();
      delete lastProviderJson[id];
    }
  }
  lastRev = '"' + snap.rev + '"';
  updateFooter(snap);
}

function cardElHtml(p) {
  return '<div id="card-' + esc(p.id) + '" class="card' +
    (p.status === "stale" ? " stale" : "") + '">' + cardInner(p) + '</div>';
}

function cardInner(p) {
  return cardHeader(p) + '<div class="rows">' +
    (p.rows || []).map(function(r) { return renderRow(r, p.status === "stale"); }).join("") +
    '</div>';
}

function cardHeader(p) {
  return '<div class="card-header">' +
    '<span class="card-title">' + esc(p.label) + '</span>' +
    '<span class="badge badge-plan">' + esc(planLabel(p.plan)) + '</span>' +
    statusBadge(p.status, p.msg) +
    '</div>';
}

function renderRow(row, isStale) {
  var hasPct = row.pct != null;
  var color = tierColor(row.tier);
  var bar = "";
  if (hasPct) {
    bar = '<div class="bar-wrap"><div class="bar"><div class="bar-fill" style="width:' +
      row.pct + '%;background:' + color + '"></div></div></div>';
  } else {
    bar = '<div class="bar-wrap"></div>';
  }
  // null-pct rows (bal/key/day): txt shows once in the usage column; the reset
  // column is empty (no countdown, no duplicate txt).
  var resetTxt = hasPct ? resetText(row.reset_at, row.txt) : "";
  return '<div class="row' + (isStale ? " stale" : "") + '">' +
    '<div class="row-inner">' +
    '<span class="label">' + esc(row.label) + '</span>' +
    bar +
    '<span class="usage">' + esc(pctText(row.pct, row.txt)) + '</span>' +
    '<span class="reset" data-reset-at="' + (row.reset_at || "") + '" data-fallback="' +
    esc(hasPct ? row.txt : "") + '">' + esc(resetTxt) + '</span>' +
    '</div></div>';
}

function updateFooter(snap) {
  var asOf = fmtTime(snap.generated_at);
  var el = document.getElementById("footer-text");
  var parts = ["Data as of " + asOf, "checked " + asOf,
               "rev " + (snap.rev || "\u2014"),
               "seq " + (snap.seq != null ? snap.seq : "\u2014")];
  // ORDER #65: server-computed age (seconds since checked_at) rides on 200
  // responses.  A 304 has no body so age is not refreshed — the web page keeps
  // the last known value, which is correct (it was fresh at the last check).
  if (snap.age != null && snap.age >= 0) {
    var tier = snap.age <= snap.next_sec * 2 ? "fresh"
             : snap.age <= snap.next_sec * 4 ? "stale" : "very stale";
    parts.push("age " + snap.age + "s (" + tier + ")");
  }
  el.textContent = parts.join(" \u00b7 ");
}

function updateFooterChecked(h) {
  var el = document.getElementById("footer-text");
  var parts = el.textContent.split(" \u00b7 ");
  if (parts.length >= 4) {
    parts[1] = "checked " + fmtTime(h.checked_at);
    if (h.rev) parts[2] = "rev " + h.rev;
    if (h.seq != null) parts[3] = "seq " + h.seq;
    el.textContent = parts.join(" \u00b7 ");
  }
}

// ---- Stats rendering ----

function tokensTotal(t) {
  if (!t) return 0;
  return (t.input || 0) + (t.output || 0) + (t.cache_read || 0) + (t.cache_write || 0);
}

function renderStats(report) {
  // Stat pills
  var todayTok = 0, monthTok = 0, todayCost = 0, monthCost = 0;
  for (var srcName in report.sources) {
    var src = report.sources[srcName];
    todayTok += tokensTotal(src.today.tokens);
    monthTok += tokensTotal(src.month.tokens);
    todayCost += src.today.cost;
    monthCost += src.month.cost;
  }
  document.getElementById("pill-today-tok").textContent = fmtTokens(todayTok);
  document.getElementById("pill-month-tok").textContent = fmtTokens(monthTok);
  document.getElementById("pill-today-cost").textContent = fmtCost(todayCost);
  document.getElementById("pill-month-cost").textContent = fmtCost(monthCost);

  // Plan-value ratio
  var ratioEl = document.getElementById("pill-month-ratio");
  ratioEl.textContent = "";
  ratioEl.className = "ratio";
  var hasRatio = false;
  for (var sn in report.sources) {
    var s = report.sources[sn];
    if (s.plan_value && s.plan_value.has_ratio) {
      hasRatio = true;
      var r = s.plan_value.ratio;
      var label = s.plan_value.label || sn;
      ratioEl.textContent = label + " " + r.toFixed(1) + "x your $" +
        s.plan_value.cost.toFixed(0) + "/mo plan";
      ratioEl.className = "ratio " + (s.plan_value.warn ? "warn" : "ok");
      break;
    }
  }
  if (!hasRatio) {
    for (var sn2 in report.sources) {
      var s2 = report.sources[sn2];
      if (s2.plan_value && !s2.plan_value.has_ratio) {
        ratioEl.textContent = s2.plan_value.label || sn2;
        ratioEl.className = "ratio";
        break;
      }
    }
  }

  // Heatmap cards
  var srcNames = Object.keys(report.sources);
  srcNames.forEach(function(name) {
    var src = report.sources[name];
    var cardEl = document.getElementById("heatmap-" + name);
    if (!cardEl) return;
    var label = name === "claude_code" ? "Claude Code" : "Codex";
    cardEl.className = "card";
    cardEl.style.display = "block";
    cardEl.innerHTML = '<div class="card-header"><span class="card-title">' + label + ' activity</span></div>' +
      heatmapHtml(src, name);
  });
  ["claude_code", "codex"].forEach(function(name) {
    var el = document.getElementById("heatmap-" + name);
    if (el && srcNames.indexOf(name) === -1) el.style.display = "none";
  });

  // Models table
  var tbody = document.querySelector("#models-table tbody");
  tbody.innerHTML = "";
  var models = [];
  for (var sn in report.sources) {
    var s = report.sources[sn];
    s.models.forEach(function(m) {
      models.push({ name: m.model, dayTok: tokensTotal(m.tokens), monthTok: 0, cost: m.cost, reqs: m.requests });
    });
  }
  models.sort(function(a, b) { return b.dayTok - a.dayTok; });
  models.forEach(function(m) {
    var tr = document.createElement("tr");
    tr.innerHTML = '<td class="model-name">' + esc(m.name) + '</td>' +
      '<td>' + fmtTokens(m.dayTok) + '</td>' +
      '<td>' + fmtTokens(m.monthTok) + '</td>' +
      '<td>' + fmtCost(m.cost) + '</td>' +
      '<td>' + m.reqs + '</td>';
    tbody.appendChild(tr);
  });

  statsRendered = true;
}

function heatmapHtml(src, srcName) {
  var days = src.days || [];
  var cells = "";

  var now = new Date();
  var today = now.toISOString().slice(0, 10);

  var weeks = [];
  for (var i = 0; i < days.length; i++) {
    var day = days[i];
    var weekIdx = Math.floor(i / 7);
    while (weeks.length <= weekIdx) weeks.push([]);
    weeks[weekIdx].push(day);
  }
  while (weeks.length < 26) weeks.push([]);

  var maxTok = 1;
  for (var d = 0; d < days.length; d++) {
    var t = tokensTotal(days[d].tokens);
    if (t > maxTok) maxTok = t;
  }

  weeks.forEach(function(week, wi) {
    week.forEach(function(day, di) {
      var tok = tokensTotal(day.tokens);
      var level = tok === 0 ? 0 : tok / maxTok;
      var cls = "heat-cell heat-" + (level < 0.01 ? 0 : level < 0.25 ? 1 : level < 0.5 ? 2 : level < 0.75 ? 3 : 4);
      var isToday = day.date === today ? " heat-today" : "";
      var title = day.date + ": " + fmtTokens(tok) + " tokens";
      cells += '<div class="' + cls + isToday + '" title="' + esc(title) + '"></div>';
    });
  });

  var summary = "Total " + fmtTokens(function() {
    var t = 0;
    for (var i in src.days) {
      t += tokensTotal(src.days[i].tokens);
    }
    return t;
  }()) + " tokens, " + src.active_days + " active days, peak " +
    fmtTokens(src.peak.tokens) + " on " + src.peak.date;

  var scale = '<div class="heatmap-scale">' +
    '<span class="swatch" style="background:#1e293b"></span>' +
    '<span class="swatch" style="background:#2a3a5e"></span>' +
    '<span class="swatch" style="background:#33415e"></span>' +
    '<span class="swatch" style="background:#3b82f6"></span>' +
    '<span class="swatch" style="background:#2563eb"></span>' +
    '<span style="margin-left:8px;color:var(--muted);font-size:10px">0 \u2014 low \u2014 high activity</span>' +
    '</div>';

  return '<div class="heatmap-container">' + '<div class="heatmap">' + cells + '</div>' + scale +
    '<div class="heat-label" style="margin-top:8px">' + esc(summary) + '</div>' + '</div>';
}

// ---- Attention rendering ----

// deviceCard renders the device-status card at the top of the Attention tab.
// It shows last seen, seconds since, observed poll interval, and the 200/304
// split — enough to prove whether deep sleep is occurring (ORDER #58 task 61).
// Device state comes from GET /v1/device (ORDER #66 task 67), polled on its
// own timer, NOT from the /v1/usage body (which is only present on 200, never
// on 304). When no device has checked in, the card shows a neutral "no data"
// state rather than an error — "waiting" is a valid state, not a failure.
function deviceCard(ds) {
  if (!ds) {
    return '<div class="device-accent">' +
      attentionItem("Device", "No data", "chip-stale",
        "Waiting for first check-in from StickS3") +
      '</div>';
  }

  // ORDER #61 task 64: this is the DEVICE's state (the StickS3 on the LAN),
  // not the browser's.  Name the address so there is never ambiguity about
  // whose state is on screen.
  var title = ds.addr ? ("Device " + ds.addr) : "Device";

  var since = ds.seconds_since;

  var chipClass, chipText;
  if (ds.state === "absent") {
    chipClass = "chip-critical";
    chipText = "Absent";
  } else if (ds.state === "connected") {
    chipClass = "chip-ok";
    chipText = "Awake";
  } else if (ds.state === "unknown") {
    chipClass = "chip-stale";
    chipText = "Unknown";
  } else {
    chipClass = "chip-stale";
    chipText = "Offline";
  }

  var parts = [];
  parts.push("last seen " + fmtTime(ds.last_seen));
  parts.push(since + "s ago");
  if (ds.interval_sec > 0) parts.push("~" + ds.interval_sec + "s poll");
  parts.push("200:" + ds.count_200 + " 304:" + ds.count_304);
  parts.push("state: " + (ds.state || "unknown"));

  return '<div class="device-accent">' +
    attentionItem(title, chipText, chipClass, parts.join(" \u00b7 ")) +
    '</div>';
}

function renderAttention(snap, statsReport) {
  var container = document.getElementById("attention");
  container.innerHTML = "";

  // Device status card (ORDER #66 task 67): from GET /v1/device, polled on its
  // own timer (see pollDevice). Device state changes every second and must
  // never sit inside the ETag-cached /v1/usage body (only present on 200,
  // absent on 304). currentDeviceState is null until the first /v1/device
  // fetch completes.
  container.insertAdjacentHTML("beforeend", deviceCard(currentDeviceState));

  if (!snap) return;

  snap.providers.forEach(function(p) {
    var maxPct = 0;
    for (var i = 0; i < (p.rows || []).length; i++) {
      if (p.rows[i].pct != null && p.rows[i].pct > maxPct) maxPct = p.rows[i].pct;
    }

    if (p.status === "auth" || p.status === "error") {
      container.insertAdjacentHTML("beforeend", attentionItem(p.label, "Critical", "chip-critical",
        "auth or error"));
    } else if (maxPct >= 80) {
      var cls = maxPct >= 95 ? "chip-critical" : "chip-watch";
      var label = maxPct >= 95 ? "Critical" : "Watch";
      container.insertAdjacentHTML("beforeend", attentionItem(p.label, label, cls,
        pctText(maxPct, "")));
    }
    if (p.status === "stale") {
      container.insertAdjacentHTML("beforeend", attentionItem(p.label, "Stale", "chip-stale",
        p.msg || ""));
    }
  });
}

function attentionItem(label, chipText, chipClass, detail) {
  return '<div class="attention-item">' +
    '<span class="chip ' + chipClass + '">' + esc(chipText) + '</span>' +
    '<span>' + esc(label) + '</span>' +
    '<span style="color:var(--muted);font-size:12px;margin-left:auto">' + esc(detail) + '</span>' +
    '</div>';
}

// ---- Actions ----

function showTokenInput() {
  var msg = document.getElementById("auth-error");
  msg.style.display = "block";
  msg.textContent = "401 Unauthorized \u2014 enter your device token to view usage data.";
  document.getElementById("token-input").style.display = "flex";
}

function saveToken() {
  var token = document.getElementById("token-field").value.trim();
  if (token) {
    localStorage.setItem("usaged_token", token);
    document.getElementById("token-input").style.display = "none";
    document.getElementById("auth-error").style.display = "none";
    loadUsage().then(function(snap) { if (snap) renderSnapshot(snap); });
    loadStats().then(function(rep) { if (rep) renderStats(rep); });
  }
}

function doRefresh() {
  var btn = document.getElementById("refresh-btn");
  btn.classList.add("refreshing");
  btn.textContent = "Refreshing…";
  var headers = authHeaders();
  headers["Content-Type"] = "application/json";
  fetch("/v1/refresh", { method: "POST", headers: headers })
    .then(function(r) {
      if (r.status === 401) {
        // The refresh failed — NOT the data view.  The usage data on screen
        // is still valid; only the early-poll was rejected.
        var msg = document.getElementById("auth-error");
        msg.style.display = "block";
        msg.textContent = "401 Unauthorized — refresh failed: enter your device token.";
        document.getElementById("token-input").style.display = "flex";
        btn.classList.remove("refreshing");
        btn.textContent = "Refresh";
        return null;
      }
      if (!r.ok) return null;
      return r.json();
    })
    .then(function(snap) {
      if (!snap) return;
      currentSnap = snap;
      renderSnapshot(snap);
      lastRev = '"' + snap.rev + '"';
    })
    .finally(function() {
      btn.classList.remove("refreshing");
      btn.textContent = "Refresh now";
    });
}

function saveInterval() {
  var sel = document.getElementById("interval-select");
  var sec = Number(sel.value);
  var headers = authHeaders();
  headers["Content-Type"] = "application/json";
  fetch("/v1/config/interval", {
    method: "PUT",
    headers: headers,
    body: JSON.stringify({ interval_sec: sec })
  }).then(function(r) {
    if (r.status === 401) { showTokenInput(); return; }
    if (!r.ok) return;
    currentInterval = sec;
    reloadIntervals();
  });
}

// ---- Init & polling ----

function init() {
  stripTokenFromUrl();
  setupTabs();
  loadConfig();
  loadUsage().then(function(snap) { if (snap) { currentSnap = snap; renderSnapshot(snap); } });
  loadStats().then(function(rep) { if (rep) renderStats(rep); });
  loadDevice().then(function(ds) { if (ds) { currentDeviceState = ds; renderAttention(currentSnap, null); } });
  renderAttention(null, null);
  document.getElementById("refresh-btn").addEventListener("click", doRefresh);
  document.getElementById("token-save").addEventListener("click", saveToken);
  document.getElementById("interval-select").addEventListener("change", saveInterval);
  document.getElementById("save-config-btn").addEventListener("click", saveSettings);
  document.getElementById("pair-open-btn").addEventListener("click", openPairWindow);
  document.getElementById("pair-confirm-btn").addEventListener("click", confirmPairCode);
  document.getElementById("pair-code-field").addEventListener("keydown", function(e) {
    if (e.key === "Enter") confirmPairCode();
  });
  document.getElementById("wifi-apply-btn").addEventListener("click", sendWifi);
  document.getElementById("wifi-cancel-btn").addEventListener("click", cancelWifi);
  document.getElementById("wifi-open-check").addEventListener("change", function() {
    var passEl = document.getElementById("wifi-pass-field");
    passEl.disabled = this.checked;
    if (this.checked) passEl.value = "";
  });
  ["wifi-ssid-field", "wifi-pass-field"].forEach(function(id) {
    document.getElementById(id).addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendWifi();
    });
  });
  // Polling intervals are derived from currentInterval so the
  // interval selector applies without a page reload.
  reloadIntervals();
}
var pollUsageTO = 0, pollStatsTO = 0, pollDeviceTO = 0, tickResetsTO = 0;
function reloadIntervals() {
  clearTimeout(pollUsageTO); clearTimeout(pollStatsTO); clearTimeout(pollDeviceTO); clearInterval(tickResetsTO);
  pollUsageTO = setTimeout(pollLoop, currentInterval * 1000);
  pollStatsTO = setTimeout(pollStats, Math.max(currentInterval * 1000, 300000));
  pollDeviceTO = setTimeout(pollDevice, 5000);  // device state changes every second
  tickResetsTO = setInterval(tickResets, 30000);
}
function pollLoop() {
  pollUsage();
  pollUsageTO = setTimeout(pollLoop, currentInterval * 1000);
}

function pollUsage() {
  loadUsage().then(function(snap) {
    if (snap) {
      currentSnap = snap;
      renderSnapshot(snap);
      renderAttention(snap, null);
    }
  });
}

// pollDevice fetches /v1/device on its own 5s timer (ORDER #66 task 67).
// Re-renders the attention tab so the device card's seconds_since ticks
// live without waiting for the next usage poll.
function pollDevice() {
  loadDevice().then(function(ds) {
    if (ds) currentDeviceState = ds;
    renderAttention(currentSnap, null);
  });
  pollDeviceTO = setTimeout(pollDevice, 5000);
}

function pollStats() {
  loadStats().then(function(rep) {
    if (rep) renderStats(rep);
  });
}

function tickResets() {
  document.querySelectorAll(".reset").forEach(function(el) {
    var ra = parseInt(el.getAttribute("data-reset-at") || "0", 10);
    var fb = el.getAttribute("data-fallback") || "";
    el.textContent = resetText(ra || null, fb);
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
