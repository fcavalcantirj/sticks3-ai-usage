[platformio]
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DESP32S3 -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -DCORE_DEBUG_LEVEL=1
lib_deps = m5stack/M5Unified@0.2.19, m5stack/M5GFX@0.2.28, bblanchon/ArduinoJson@7.4.3
extra_scripts = pre:scripts/build_id.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
